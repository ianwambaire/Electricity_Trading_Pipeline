# Include this file inside the existing HTTPS server block, before the
# Streamlit `location /` block. The trailing slash on proxy_pass intentionally
# removes the public /api/ prefix before forwarding to FastAPI.
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
