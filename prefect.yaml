---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: electricity-trading-pipeline
prefect-version: 3.7.5

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# Runs execute from the persistent EC2 checkout configured below. A git-clone
# pull step would lose ignored local datasets, frozen artifacts, and .env.
pull: null

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: powerflow-entsoe-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  description: PowerFlow incremental ENTSO-E silver/gold forecasting pipeline
  entrypoint: src/scheduled_pipeline.py:powerflow_entsoe_pipeline
  parameters:
    mode: incremental
    start_date: null
    end_date: null
    storage_backend: s3
  work_pool:
    name: electricity-pool
    work_queue_name: null
    job_variables:
      working_dir: /home/ec2-user/Electricity_Trading_Pipeline
  schedules:
  - cron: "0 * * * *"
    timezone: UTC
    day_or: true
    active: true
