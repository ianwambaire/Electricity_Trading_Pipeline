# PROPOSAL ONLY. Include inside http {}; never install before approval/nginx -t.
# Must not duplicate named zones/log formats in the installed configuration.
server_tokens off;
limit_req_zone $binary_remote_addr zone=powerflow_api:1m rate=5r/s;
log_format powerflow_safe '$time_iso8601 $status $request_time $body_bytes_sent $request_id';
