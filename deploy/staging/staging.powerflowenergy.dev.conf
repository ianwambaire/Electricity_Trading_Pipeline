# PROPOSAL: separate hostname only; existing apex configuration remains untouched.
server {
    listen 443 ssl;
    server_name staging.powerflowenergy.dev;
    # PROPOSED certificate paths, verify existing public cert metadata before approval.
    ssl_certificate /etc/letsencrypt-powerflow-staging/live/staging.powerflowenergy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-powerflow-staging/live/staging.powerflowenergy.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/powerflow-staging/current;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    access_log /var/log/nginx/powerflow-safe.log powerflow_safe;
    # Error logs can include raw URI at lower severity. Separate approved retention.
    error_log /var/log/nginx/powerflow-error.log crit;
    include /etc/nginx/powerflow/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/powerflow-staging-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api { return 404; }
    location ~* ^/api/(ready|docs|redoc|openapi\.json)(/|$) { return 404; }
    location /api/ {
        # No ^~: internal-route regex above must take precedence.
        limit_req zone=powerflow_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host staging.powerflowenergy.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control no-store always;
        include /etc/nginx/powerflow/security-headers.conf;
    }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(src|tests|node_modules|deploy|database|data|artifacts)(/|$) { return 404; }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/powerflow/security-headers.conf;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/powerflow/security-headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache always;
        include /etc/nginx/powerflow/security-headers.conf;
    }
}
