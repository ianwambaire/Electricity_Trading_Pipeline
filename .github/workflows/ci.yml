name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements/shared.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify protected production artifacts
        shell: bash
        run: |
          sha256sum -c <<'EOF'
          14040b7696e8f433b50bb82c5cb0501c85c9874987f1ca68d814bc05c1736b4c  artifacts/models/final_gold_model.joblib
          227ecd25aa75d482cfdedb8e4ca13ebb41da575836310871feac12199fb4e9c9  artifacts/models/final_gold_model_features.joblib
          64939ce5317b5aa6cffb169e1f8b9bbc7304508c496b9bcc71d701bfeb2e7dd6  artifacts/models/final_model_release_manifest.json
          69a3fa10f45c18c4733b3f8e12792e36ec9b209b7afd5e94a9932315e4dde0ed  artifacts/models/releases/next24h/next24h_model.joblib
          1d6554e469a869613dd91d820b0537b4562321ea69e8827ecb83137950078a88  artifacts/models/releases/next24h/next24h_feature_contract.joblib
          1b2d4ce56f178bc236de1bb93d4ce30a09f990d9116dadaa609f86c708131650  artifacts/models/releases/next24h/next24h_release_manifest.json
          EOF

      - name: Run test suite
        run: python -m pytest -q

      - name: Check production imports
        run: python scripts/check_production_imports.py

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Check diff whitespace
        run: git diff --check

  api-runtime:
    name: Isolated API runtime and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/api*.lock
      - name: Install locked API test environment
        run: python -m pip install -r requirements/api-test.lock
      - run: python -m pip check
      - run: python scripts/check_api_runtime.py
      - name: Run API authorization and runtime regressions without research packages
        run: python -m pytest -q -m "not model_runtime" tests/test_api.py tests/test_api_security.py tests/test_account_management.py tests/test_mfa.py tests/test_backend_hardening.py tests/test_public_market_api.py tests/test_api_deployment.py tests/test_phase5_restoration.py tests/test_streamlit_decoupling.py

  orchestration-runtime:
    name: Separate production orchestration imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-prod.txt
      - run: python -m pip check
      - run: python scripts/check_production_imports.py

  frontend:
    name: React tests and production artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-build.mjs
      - run: npm audit --audit-level=high
