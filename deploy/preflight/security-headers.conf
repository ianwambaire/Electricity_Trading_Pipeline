# Proposal; include in EVERY location with add_header (Nginx inheritance).
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Start Report-Only; enforcement requires real Cognito/chart/browser acceptance.
# Local fonts; Recharts inline style attributes currently need unsafe-inline.
# No report-uri: do not send callback URLs/codes to an unreviewed collector.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://cognito-idp.us-east-1.amazonaws.com https://us-east-1nloyfrvex.auth.us-east-1.amazoncognito.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://us-east-1nloyfrvex.auth.us-east-1.amazoncognito.com" always;
